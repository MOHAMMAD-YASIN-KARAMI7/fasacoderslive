<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>

    <!-- Border & Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Outer Glow Aura -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#primary-grad)" opacity="0.3" filter="url(#soft-glow)" />

  <!-- Base Card Body -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" stroke="url(#primary-grad)" stroke-width="12" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="48" y="48" width="416" height="416" rx="96" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="4" />

  <!-- Icon Symbol: Glowing Code Brackets + Forward Slash (< />) -->
  <g filter="url(#glow)">
    <!-- Left Angle Bracket '<' -->
    <path d="M 170 180 L 105 256 L 170 332" 
          fill="none" 
          stroke="#06b6d4" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Forward Slash '/' -->
    <path d="M 282 160 L 230 352" 
          fill="none" 
          stroke="url(#primary-grad)" 
          stroke-width="36" 
          stroke-linecap="round" />

    <!-- Right Angle Bracket '>' -->
    <path d="M 342 180 L 407 256 L 342 332" 
          fill="none" 
          stroke="#a855f7" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Glowing Dot / Live Status Indicator -->
  <circle cx="390" cy="122" r="20" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="390" cy="122" r="10" fill="#ffffff" />
</svg>
